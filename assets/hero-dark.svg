r="1.5" fill="#B8FF2C" style="animation-duration:7.4s;animation-delay:-9.1s"/><circle class="pt" cx="1025" cy="600" r="3" fill="#9DABA5" style="animation-duration:8.7s;animation-delay:-5.0s"/><circle class="pt" cx="1034" cy="600" r="1.5" fill="#B8FF2C" style="animation-duration:12.6s;animation-delay:-4.6s"/><circle class="pt" cx="1009" cy="600" r="3" fill="#B8FF2C" style="animation-duration:7.4s;animation-delay:-10.0s"/><circle class="pt" cx="797" cy="600" r="2" fill="#9DABA5" style="animation-duration:9.4s;animation-delay:-11.9s"/></g>
<rect class="scan" x="720" y="-2" width="480" height="2" fill="url(#sl)"/>
</g>
<rect x=".5" y=".5" width="1199" height="619" rx="19.5" stroke="#273130"/>

<g class="up" style="animation-delay:.1s">
<rect x="52" y="58" width="10" height="10" fill="#B8FF2C"/>
<text class="mono" x="76" y="68" font-size="17" fill="#9DABA5">mmojena / criador e fundador</text>
