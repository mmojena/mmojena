<text class="show" style="animation-delay:0.7s" x="46" y="214" font-size="108" font-weight="700" letter-spacing="-5" fill="#F2F4EF">Miguel</text><rect class="bar" style="animation-delay:0.25s" x="44" y="128" width="350" height="100" fill="#B8FF2C"/>
<text class="show" style="animation-delay:0.95s" x="46" y="318" font-size="108" font-weight="700" letter-spacing="-5" fill="#F2F4EF">Mojena<tspan fill="#B8FF2C">.</tspan></text><rect class="bar" style="animation-delay:0.5s" x="44" y="232" width="420" height="100" fill="#B8FF2C"/>
