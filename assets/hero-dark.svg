<text class="w w1" style="animation-delay:2.2s" x="52" y="436" font-size="24" fill="#9DABA5">Sites institucionais.</text><text class="w" style="animation-delay:5.2s" x="52" y="436" font-size="24" fill="#9DABA5">Landing pages.</text><text class="w" style="animation-delay:8.2s" x="52" y="436" font-size="24" fill="#9DABA5">Produtos digitais.</text>
