<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" fill="none" role="img" aria-labelledby="t d">
<title id="t">Miguel Mojena — criador e fundador</title>
<desc id="d">Ideias que ganham forma. Sites institucionais, landing pages e produtos digitais. Monograma M em construção, com um ponto de luz em órbita.</desc>
<style>
text{font-family:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.up{animation:up 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(36px)}}
.draw{stroke-dasharray:1;animation:draw 2.4s cubic-bezier(.6,0,.2,1) both}
@keyframes draw{from{stroke-dashoffset:1}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.6s cubic-bezier(.6,0,.2,1) .9s both}
@keyframes grow{from{transform:scaleX(0)}}
.m{transform-box:fill-box;transform-origin:center;animation:m 1.4s cubic-bezier(.2,.8,.2,1) .5s both}
@keyframes m{from{opacity:0;transform:scale(.86)}}
.cut{animation:cut 1.2s cubic-bezier(.6,0,.2,1) 1.1s both}
@keyframes cut{from{transform:translate(-110px,-110px)}}
.sq{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1) 1.8s both,beat 3.2s ease-in-out 2.6s infinite}
@keyframes pop{from{transform:scale(0)}}
@keyframes beat{50%{transform:scale(.82)}}
.orbit{transform-origin:960px 300px;animation:spin 16s linear infinite}
.orbit2{transform-origin:960px 300px;animation:spin 28s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.glow{animation:glow 5s ease-in-out infinite}
@keyframes glow{50%{opacity:.35}}
.w{opacity:0;animation:word 9s ease both infinite}
.w1{opacity:1}
@keyframes word{0%{opacity:0;transform:translateY(14px)}5%,30%{opacity:1;transform:none}35%,100%{opacity:0;transform:translateY(-14px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
.nudge{animation:nudge 2.4s ease-in-out 2.5s infinite}
@keyframes nudge{50%{transform:translate(5px,-5px)}}
</style>
<defs>
<pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#E4E9E0"/></pattern>
<radialGradient id="fade" cx="960" cy="300" r="420" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<mask id="gm"><rect width="1200" height="620" fill="url(#fade)"/></mask>
<radialGradient id="lime" cx="960" cy="300" r="260" gradientUnits="userSpaceOnUse"><stop stop-color="#B8FF2C" stop-opacity=".35"/><stop offset="1" stop-color="#B8FF2C" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="1200" height="620" rx="20"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="620" fill="#F4F6F1"/>
<rect width="1200" height="620" fill="url(#g)" mask="url(#gm)"/>
<circle class="glow" cx="960" cy="300" r="260" fill="url(#lime)"/>
</g>
<rect x=".5" y=".5" width="1199" height="619" rx="19.5" stroke="#D5DBD2"/>

<g class="up" style="animation-delay:.1s">
<rect x="52" y="58" width="10" height="10" fill="#B8FF2C"/>
<text class="mono" x="76" y="68" font-size="17" fill="#56625D">mmojena / criador e fundador</text>
</g>
<text class="up" style="animation-delay:.25s" x="46" y="214" font-size="108" font-weight="700" letter-spacing="-5" fill="#111719">Miguel</text>
<text class="up" style="animation-delay:.4s" x="46" y="318" font-size="108" font-weight="700" letter-spacing="-5" fill="#111719">Mojena<tspan fill="#3F5F00">.</tspan></text>
<text class="up" style="animation-delay:.6s" x="52" y="386" font-size="34" letter-spacing="-.6" fill="#111719">Ideias que ganham forma.</text>
<text class="w w1" style="animation-delay:1.6s" x="52" y="436" font-size="24" fill="#56625D">Sites institucionais.</text><text class="w" style="animation-delay:4.6s" x="52" y="436" font-size="24" fill="#56625D">Landing pages.</text><text class="w" style="animation-delay:7.6s" x="52" y="436" font-size="24" fill="#56625D">Produtos digitais.</text>
<path class="grow" d="M52 490H660" stroke="#D5DBD2"/>
<g class="up" style="animation-delay:1.2s">
<circle cx="60" cy="535" r="5" fill="#B8FF2C"/><circle class="ping" cx="60" cy="535" r="5" fill="#B8FF2C"/>
<text class="mono" x="78" y="541" font-size="16" fill="#56625D">disponível para novos projetos</text>
<text x="660" y="541" font-size="18" font-weight="600" text-anchor="end" fill="#3F5F00">Conheça meu trabalho <tspan class="nudge">↗</tspan></text>
</g>

<g stroke="#D5DBD2" stroke-width="1.2">
<path class="draw" pathLength="1" d="M790 0V620M1130 0V620" style="animation-delay:.2s"/>
<path class="draw" pathLength="1" d="M720 130H1200M720 470H1200" style="animation-delay:.35s"/>
<path class="draw" pathLength="1" d="M800 140L1120 460M800 460L1120 140" style="animation-delay:.5s"/>
<circle class="draw" pathLength="1" cx="960" cy="300" r="200" transform="rotate(-90 960 300)" style="animation-delay:.3s"/>
<circle class="draw" pathLength="1" cx="960" cy="300" r="250" stroke-dasharray="1" opacity=".6" transform="rotate(90 960 300)" style="animation-delay:.6s"/>
</g>
<g stroke="#56625D" class="up" style="animation-delay:1s"><path d="M946 86H974M960 72V100M946 514H974M960 500V528"/></g>
<g transform="translate(820 160) scale(2.8)">
<g class="m"><path d="M0 0h24l26 28L76 0h24v100H76V38L50 66 24 38v62H0z" fill="#111719"/></g>
<clipPath id="mb"><rect width="100" height="100"/></clipPath>
<g clip-path="url(#mb)"><path class="cut" d="M0 0h10l90 90v10H90L0 10z" fill="#F4F6F1"/></g>
<rect class="sq" x="80" y="80" width="20" height="20" fill="#B8FF2C"/>
</g>
<g class="orbit"><circle cx="960" cy="100" r="5" fill="#B8FF2C"/><circle cx="960" cy="100" r="12" stroke="#B8FF2C" opacity=".4"/></g>
<g class="orbit2"><circle cx="960" cy="550" r="3.5" fill="#56625D"/></g>
<circle cx="790" cy="130" r="4" fill="#B8FF2C" class="up" style="animation-delay:1.4s"/>
<circle cx="1130" cy="470" r="4" fill="#B8FF2C" class="up" style="animation-delay:1.5s"/>

</svg>
